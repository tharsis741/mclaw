[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "m-claw"
version = "1.0.0"
description = "Robot agent runtime for M-Robots OS"
readme = "README.zh-CN.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "ACKNOWLEDGEMENTS.md",
]
authors = [
    { name = "Shenzhen Kaihong Digital Industry Development Co., Ltd." },
]
keywords = [
    "ai-agent",
    "cli",
    "desktop",
    "tools",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core LLM SDKs
    "openai>=2.21.0,<3",
    "anthropic>=0.39.0,<1",

    # HTTP / networking
    "httpx>=0.28.1,<1",
    "requests>=2.33.0,<3",

    # CLI / TUI
    "fire>=0.7.1,<1",
    "prompt_toolkit>=3.0.52,<4",
    "rich>=14.3.3,<15",

    # Data / config / templating
    "python-dotenv>=1.2.1,<2",
    "pyyaml>=6.0.2,<7",
    "jinja2>=3.1.5,<4",
    "pydantic>=2.12.5,<3",

    # Utilities
    "tenacity>=9.1.4,<10",
    "PyJWT[crypto]>=2.12.0,<3",

    # Search / web integrations
    "exa-py>=2.9.0,<3",
    "trafilatura>=2.1.0,<3",

    # Browser automation
    "playwright>=1.40.0",

    # Runtime integrations: MCP, voice, pet, and channels
    "mcp>=1.2.0,<2",
    "dashscope>=1.25.6",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "PySide6>=6.7,<7",
    "qrcode>=8.0,<9",
    "dingtalk-stream>=0.20",
    "alibabacloud-dingtalk>=2.2.39",

    # Document / office skill runtime dependencies
    "python-pptx>=1.0.0,<2",
    "Pillow>=10.0.0,<12",
    "defusedxml>=0.7.1,<1",
    "markitdown[pptx]>=0.1.0",

    # Test runner dependencies included in the default source install
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",

    # Platform PTY support
    "pywinpty>=2.0.0,<3; platform_system=='Windows'",
    "ptyprocess>=0.7.0,<1; platform_system!='Windows'",
]

[project.scripts]
mclaw = "mclaw.cli.main:main"

[tool.setuptools.packages.find]
include = ["mclaw", "mclaw.*"]

[tool.setuptools.package-data]
mclaw = [
    "skills/**/*",
    "skills/**/.rels",
    "pet/assets/**/*",
]

[tool.setuptools.exclude-package-data]
mclaw = [
    "**/__pycache__/*",
    "**/*.pyc",
]
